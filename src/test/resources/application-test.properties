spring.datasource.url=jdbc:h2:mem:hrm_portal_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

spring.flyway.enabled=false
spring.sql.init.mode=never

# Deliberately non-production signing material used only by the test profile.
jwt.secret=dGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS1mb3ItYXV0b21hdGVkLXRlc3RzLTIwMjY=

logging.level.root=INFO
logging.level.com.workforce.hrm=INFO
logging.level.org.springframework.security=INFO
